[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "modelos-np3"
version = "2.0.0"
description = "Modelos RNN (LSTM/GRU) para predição de forragem em pastagens — Agricultura Digital"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Davi Lemos",     email = "davilemos.aluno@unipampa.edu.br" },
    { name = "Bianca Durgante", email = "biancadurgante.aluno@unipampa.edu.br" },
    { name = "Leonardo Pinho",  email = "leonardopinho@unipampa.edu.br" },
]
keywords = ["rnn", "lstm", "gru", "keras", "agricultura-digital", "pecuaria", "predicao"]

dependencies = [
    "tensorflow>=2.19.0",
    "keras>=3.8.0",
    "keras-tuner>=1.4.7",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.10.0",
    "psycopg2-binary>=2.9.10",
    "pydot>=3.0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
